spring.application.name=employee-management-system

# Override these values through environment variables outside local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:employee_app}
spring.datasource.password=${DB_PASSWORD:local_dev_only}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

info.app.name=Employee Management System
info.app.version=1.0.0
