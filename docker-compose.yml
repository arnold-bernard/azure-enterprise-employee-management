services:
  mysql:
    image: mysql:8.4
    container_name: employee-mysql
    environment:
      MYSQL_DATABASE: employee_db
      MYSQL_USER: employee_app
      MYSQL_PASSWORD: local_dev_only
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal_root_only"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
